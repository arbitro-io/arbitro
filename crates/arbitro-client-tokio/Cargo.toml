[package]
name    = "arbitro-client-tokio"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Pure-tokio Arbitro client built on arbitro-kit primitives (Mpsc, OneShotAsync, Pipe, Hub) with reconnect state machine + heartbeat watchdog."

[features]
default = []
tls = ["tokio-rustls", "rustls", "webpki-roots"]
# JSON helpers on StepContext (json_or_default / json_merge / json_replace).
# Off by default: the workflow context is opaque bytes and JSON is only one
# way to use it, so serde stays out of the graph unless asked for.
json = ["serde", "serde_json"]

[dependencies]
arbitro-proto      = { path = "../arbitro-proto" }
arbitro-engine-v2  = { workspace = true }
arbitro-kit        = { path = "../../../arbitro-kit", features = ["tokio"] }
tokio         = { workspace = true }
tokio-util    = { version = "0.7", features = ["rt"] }
tracing       = { workspace = true }
bytes         = { workspace = true }
zerocopy      = { workspace = true }
fastrand      = "2"
thiserror     = "1"

# TLS (optional — enable with `features = ["tls"]`)
tokio-rustls  = { version = "0.26", optional = true }
rustls        = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots  = { version = "0.26", optional = true }

# JSON step helpers (optional — enable with `features = ["json"]`)
serde         = { version = "1", optional = true }
serde_json    = { version = "1", optional = true }

# `flock` for the ackstore single-writer directory lock (src/ackstore/lock.rs).
# Already in this crate's graph via tokio on unix, so it adds no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio          = { workspace = true }
criterion      = { workspace = true }
tempfile       = { workspace = true }
arbitro-server = { path = "../arbitro-server" }
arbitro-proto  = { path = "../arbitro-proto" }

[[bench]]
name    = "publish_throughput"
harness = false

[[bench]]
name    = "client_publish"
harness = false
