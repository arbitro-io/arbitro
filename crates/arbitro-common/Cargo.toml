[package]
name = "arbitro-common"
version = "0.5.5"
edition = "2021"
license = "MIT"
description = "Shared primitives (gate, name registry) used across Arbitro crates"

[dependencies]
arbitro-engine-v2 = { workspace = true }
arbitro-kit       = { workspace = true }
foldhash          = "0.1"
arc-swap          = { workspace = true }
tokio             = { workspace = true }

[dev-dependencies]
criterion    = { version = "0.5", features = ["html_reports"] }
parking_lot  = { workspace = true }

[[bench]]
name = "consumer_cursor"
harness = false

[[bench]]
name = "publish_path"
harness = false

[[bench]]
name = "stream_shard"
harness = false

[[bench]]
name = "sync_primitives"
harness = false

[[bench]]
name = "index_shapes"
harness = false

[[bench]]
name = "subject_walk"
harness = false
